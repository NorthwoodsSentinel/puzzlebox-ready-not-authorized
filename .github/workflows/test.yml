# Runs the whole fixture story (run.sh) on every push and pull request.
# Actions are pinned to full commit SHAs, not tags: a tag can be moved to different code, a SHA cannot.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  run-sh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: ./run.sh
